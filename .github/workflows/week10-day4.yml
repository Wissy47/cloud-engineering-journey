name: Week 10 Day 4 - Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "week10/day4/**"
      - ".github/workflows/week10-day4.yml"

  pull_request:
    branches:
      - main
    paths:
      - "week10/day4/**"
      - ".github/workflows/week10-day4.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./week10/day4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Verify Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color
      - name: Start disposable floci
        run: |
          docker run -d \
            --name week10-day4-floci \
            -p 127.0.0.1:4566:4566 \
            floci/floci:2.3.0

      - name: Wait for floci health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:4566/_localstack/health \
              > /dev/null; then
              echo "floci health check passed"
              exit 0
            fi

            echo "Waiting for floci: attempt ${attempt}"
            sleep 2
          done

          docker logs --tail 80 week10-day4-floci
          exit 1

      - name: Generate Terraform plan
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -refresh=false \
            -detailed-exitcode

          PLAN_EXIT_CODE=$?

          set -e

          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform plan succeeded: infrastructure changes proposed."
          elif [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            echo "Terraform plan succeeded: no infrastructure changes."
          else
            echo "Terraform plan failed with exit code ${PLAN_EXIT_CODE}."
            exit "$PLAN_EXIT_CODE"
          fi

      - name: Show floci logs on failure
        if: failure()
        run: docker logs --tail 100 week10-day4-floci 2>&1 || true
