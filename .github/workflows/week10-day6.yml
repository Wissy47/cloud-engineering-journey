
name: Week 10 Day 6 - Integrated CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "week10/day2/**"
      - "week10/day3/**"
      - "week10/day4/**"
      - "week10/day6/**"
      - ".github/workflows/week10-day6.yml"

  pull_request:
    branches:
      - main
    paths:
      - "week10/day2/**"
      - "week10/day3/**"
      - "week10/day4/**"
      - "week10/day6/**"
      - ".github/workflows/week10-day6.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week10/day2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest -v

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./week10/day3
          platforms: linux/amd64
          push: false
          load: true
          tags: week10-day6-api:ci

      - name: Verify image architecture
        run: |
          docker image inspect week10-day6-api:ci \
            --format 'OS={{.Os}} Architecture={{.Architecture}}'

      - name: Start application container
        run: |
          docker run -d \
            --name week10-day6-api-test \
            -p 127.0.0.1:8096:8080 \
            week10-day6-api:ci

      - name: Verify application health
        run: |
          set -euo pipefail

          for attempt in $(seq 1 15); do
            if curl --fail --silent \
              http://127.0.0.1:8096/health; then
              echo
              echo "Day 6 container health check passed"
              exit 0
            fi

            sleep 1
          done

          echo "Container health verification failed"
          docker logs week10-day6-api-test
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs week10-day6-api-test 2>&1 || true

      - name: Clean up test container
        if: always()
        run: |
          if docker container inspect week10-day6-api-test \
            > /dev/null 2>&1; then
            docker rm -f week10-day6-api-test
            echo "Day 6 test container removed"
          fi

  terraform-validation:
    name: Validate and Plan Terraform
    needs: [python-tests, docker-build]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./week10/day4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Start isolated floci
        run: |
          docker run -d \
            --name week10-day6-floci \
            -p 127.0.0.1:4566:4566 \
            floci/floci:2.3.0

      - name: Wait for floci health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:4566/_localstack/health \
              > /dev/null; then
              echo "Day 6 floci health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "floci did not become healthy"
          exit 1

      - name: Generate Terraform plan
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -refresh=false \
            -detailed-exitcode

          PLAN_EXIT_CODE=$?

          set -e

          case "$PLAN_EXIT_CODE" in
            0)
              echo "Terraform plan succeeded: no changes"
              ;;
            2)
              echo "Terraform plan succeeded: changes proposed"
              ;;
            *)
              echo "Terraform plan failed"
              exit "$PLAN_EXIT_CODE"
              ;;
          esac

      - name: Show floci logs on failure
        if: failure()
        run: |
          docker logs --tail 100 week10-day6-floci 2>&1 || true

      - name: Clean up isolated floci
        if: always()
        run: |
          if docker container inspect week10-day6-floci \
            > /dev/null 2>&1; then
            docker rm -f week10-day6-floci
            echo "Day 6 floci container removed"
          fi

  deployment-simulation:
    name: Simulate Development Deployment
    needs: [python-tests, docker-build, terraform-validation]
    runs-on: ubuntu-latest

    environment:
      name: development

    env:
      APP_ENV: ${{ vars.APP_ENV }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      TARGET_ENV: development

    steps:
      - name: Validate deployment environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$APP_ENV" || -z "$LOG_LEVEL" ]]; then
            echo "Required environment variables are missing."
            exit 1
          fi

          if [[ "$APP_ENV" != "$TARGET_ENV" ]]; then
            echo "Deployment environment mismatch."
            exit 1
          fi

          if [[ "$LOG_LEVEL" != "DEBUG" ]]; then
            echo "Unexpected development log level."
            exit 1
          fi

          echo "Deployment environment verified."

      - name: Simulate deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "All required quality gates passed."
          echo "Target environment: $TARGET_ENV"
          echo "Application configuration: $APP_ENV"
          echo "Log level: $LOG_LEVEL"
          echo "Development deployment simulation successful."
          echo "No infrastructure was modified."
