
name: Week 10 Day 2 - Python CI Tests

on:
  push:
    branches:
      - main
    paths:
      - "week10/day2/**"
      - ".github/workflows/week10-day2.yml"

  pull_request:
    branches:
      - main
    paths:
      - "week10/day2/**"
      - ".github/workflows/week10-day2.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Run Python Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week10/day2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v
